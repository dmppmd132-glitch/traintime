<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#212529" />
    <meta name="description" content="台鐵時刻查詢 iOS PWA 設定與正式網站入口" />
    <title>台鐵時刻查詢｜iOS PWA</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7f9; color: #1f2933; }
      main { box-sizing: border-box; width: min(92vw, 620px); padding: 2.5rem 2rem; border-radius: 24px; background: #fff; box-shadow: 0 16px 48px rgba(33, 37, 41, .12); text-align: center; }
      h1 { margin: 0 0 .75rem; font-size: clamp(1.5rem, 5vw, 2.2rem); }
      p { line-height: 1.8; color: #52606d; }
      a.button { display: inline-block; margin-top: 1rem; padding: .8rem 1.25rem; border-radius: 999px; background: #212529; color: #fff; text-decoration: none; font-weight: 700; }
      a.help { display: inline-block; margin-top: 1.25rem; color: #52606d; font-size: .9rem; }
      @media (prefers-color-scheme: dark) {
        body { background: #111827; color: #f3f4f6; }
        main { background: #1f2937; box-shadow: 0 16px 48px rgba(0, 0, 0, .28); }
        p, a.help { color: #cbd5e1; }
        a.button { background: #f3f4f6; color: #111827; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>台鐵時刻查詢</h1>
      <p>iOS PWA 設定檔已放置於本 GitHub repository。正式的時刻查詢服務請從下方入口開啟。</p>
      <a class="button" href="https://traintime.jsy.tw/">開啟台鐵時刻查詢</a>
      <br />
      <a class="help" href="https://github.com/dmppmd132-glitch/traintime/blob/main/docs/ios-pwa.md">查看 iOS PWA 部署說明</a>
    </main>
  </body>
</html>
